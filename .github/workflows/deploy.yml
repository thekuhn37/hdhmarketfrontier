name: Deploy to Cloud Run

# Triggers:
#   - Every push to main branch (automatic production deploy)
#   - Manual trigger from GitHub Actions UI (for hotfixes or rollbacks)
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PROJECT_ID: hdhmarketfrontier
  REGION: asia-northeast3
  SERVICE_NAME: hdhmarketfrontier
  IMAGE: asia-northeast3-docker.pkg.dev/hdhmarketfrontier/hdhmarketfrontier/frontend

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Authenticate to GCP via Workload Identity Federation ──────────────
      # No JSON key needed — GitHub gets a short-lived token from Google directly
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/816338366615/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@hdhmarketfrontier.iam.gserviceaccount.com

      # ── 3. Set up gcloud CLI ─────────────────────────────────────────────────
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ── 4. Configure Docker to push to Artifact Registry ─────────────────────
      - name: Configure Docker auth
        run: gcloud auth configure-docker asia-northeast3-docker.pkg.dev --quiet

      # ── 5. Build Docker image ─────────────────────────────────────────────────
      # NEXT_PUBLIC_* vars must be build args — they are baked into JS bundles.
      # Server-only secrets (SUPABASE_SERVICE_ROLE_KEY etc.) are NOT build args;
      # they are injected at Cloud Run runtime.
      - name: Build Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            --build-arg NEXT_PUBLIC_SITE_URL="${{ secrets.NEXT_PUBLIC_SITE_URL }}" \
            --build-arg NEXT_PUBLIC_LICENSE_POLICY_API_BASE_URL="" \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest \
            .

      # ── 6. Push image to Artifact Registry ───────────────────────────────────
      - name: Push image
        run: docker push --all-tags $IMAGE

      # ── 7. Deploy to Cloud Run ────────────────────────────────────────────────
      # Server-only env vars are set here (not in the Docker image).
      # --min-instances 0  → scale to zero when no traffic (lowest cost)
      # --max-instances 10 → cap to avoid unexpected billing spikes
      # --concurrency 80   → handles 80 requests per instance
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image "$IMAGE:${{ github.sha }}" \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --port 3000 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --concurrency 80 \
            --timeout 60 \
            --set-env-vars "NODE_ENV=production,SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }},OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }},RESEND_API_KEY=${{ secrets.RESEND_API_KEY }},CONTACT_RECEIVER_EMAIL=harryhwang37@gmail.com"

      # ── 8. Print deployed URL ─────────────────────────────────────────────────
      - name: Get service URL
        run: |
          URL=$(gcloud run services describe $SERVICE_NAME \
            --region $REGION --format='value(status.url)')
          echo "✅ Deployed: $URL"
